name: Validate 0.18 product candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product018:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT: ${{ github.workspace }}/work/toolchain/linux/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.7'
      - run: python tools/bootstrap.py linux
      - run: python tools/bootstrap.py templates
      - run: python -m unittest discover -s tools -p test_history_validation.py
      - run: python tools/check_product018.py --full
      - run: python tools/build_windows_product018.py
